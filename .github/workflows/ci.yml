name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is used as the required status check — keep it stable.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (pnpm@10.4.1);
      # also passing `version` here makes pnpm/action-setup fail on the mismatch check.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      # Full test suite is not run yet: it requires a bootstrapped local
      # oxm_test MySQL database (server/test-db-guard.ts), not yet set up in CI.
      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production
