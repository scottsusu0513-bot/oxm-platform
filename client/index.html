<!doctype html>
<html lang="zh-TW">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>OXM｜全台最齊全工廠與工作室媒合平台（OEM / ODM）</title>
    <meta name="description" content="找代工不再浪費時間。OXM 幫你快速找到合適廠商、直接聯繫、有效比對，讓媒合更透明、更有效率。" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      GEO 預渲染修好之後才出現的新問題：伺服器回來的 HTML 裡 #root 已經塞了
      build-time 產生的純語意化文字（給爬蟲讀的，故意不帶任何 class），瀏覽器
      在 React 掛載、Tailwind 套用完成前就會先用瀏覽器預設樣式畫出這段文字，
      造成「登入切換瞬間」這類整頁重新載入的時刻，短暫看到一段沒有樣式的裸
      文字。這裡直接寫在 <head> 的 inline <style>，在任何外部 CSS／JS 載入前
      就先生效：預設隱藏 #root（visibility，不用 display，避免萬一 JS 掛掉
      永久白畫面)，蓋一層品牌風格的全螢幕載入畫面，等 React 真正完成掛載後
      再由 main.tsx 淡出這層遮罩、顯示 #root。不影響 #root 內容本身，爬蟲仍然
      讀得到完整的預渲染文字。
    -->
    <style>
      #root { visibility: hidden; }
      #root.app-ready { visibility: visible; }

      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        opacity: 1;
        transition: opacity 200ms ease;
      }
      #app-loading.is-hiding { opacity: 0; pointer-events: none; }
      #app-loading.is-hidden { display: none; }

      .app-loading-logo {
        font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.02em;
        background: linear-gradient(90deg, #f97316, #f59e0b, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .app-loading-spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #e5e7eb;
        border-top-color: #f97316;
        border-radius: 9999px;
        animation: app-loading-spin 0.8s linear infinite;
      }
      .app-loading-text {
        font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
        font-size: 13px;
        color: #9ca3af;
      }
      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading-spinner { animation-duration: 1.6s; }
      }
    </style>
  </head>

  <body style="background-color: #FFF7ED;">
    <div id="app-loading">
      <div class="app-loading-logo">OXM</div>
      <div class="app-loading-spinner"></div>
      <div class="app-loading-text">載入中…</div>
    </div>
    <div id="root"></div>
    <!--
      單一共用、一次性的顯示函式——正常路徑（client/src/main.tsx 的
      AppReadySignal，React 首次 commit 後觸發）與下面的 5 秒 fallback
      都只呼叫這一個函式，不各自維護一份 DOM 操作，避免兩套流程互相競態
      或未來改邏輯時只改到其中一邊。window.__oxmAppShown 確保不管被呼叫
      幾次（例如 React 已經正常觸發過，5 秒後 fallback 又跟著跑一次），
      實際的顯示/淡出動作都只會真正執行一次。
    -->
    <script>
      window.__showOxmApp = function () {
        if (window.__oxmAppShown) return;
        window.__oxmAppShown = true;

        var rootElement = document.getElementById("root");
        var loadingElement = document.getElementById("app-loading");

        rootElement && rootElement.classList.add("app-ready");

        requestAnimationFrame(function () {
          loadingElement && loadingElement.classList.add("is-hiding");

          window.setTimeout(function () {
            loadingElement && loadingElement.classList.add("is-hidden");
          }, 200);
        });
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      保險機制：正常情況下 main.tsx 的 AppReadySignal 會在 React 完成首次
      掛載後立刻呼叫 window.__showOxmApp()；這裡只是萬一 JS 發生例外導致
      React 完全沒有執行到那一步時的最後防線，避免載入畫面永久卡住整個
      網站。純 inline script、不依賴任何模組，就算 /src/main.tsx 本身載入
      失敗也會執行；呼叫的是同一個函式，靠函式內建的一次性 guard 防止跟
      正常流程重複觸發。
    -->
    <script>
      window.setTimeout(function () {
        window.__showOxmApp && window.__showOxmApp();
      }, 5000);
    </script>
  </body>

</html>
